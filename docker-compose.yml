services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-tasktracker}:${POSTGRES_PASSWORD:-tasktracker}@db:5432/${POSTGRES_DB:-tasktracker}?schema=public"
      AUTH_SECRET: "${AUTH_SECRET:-local-dev-secret-change-before-sharing}"
      AUTH_TRUST_HOST: "true"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_DISPLAY_NAME: "${ADMIN_DISPLAY_NAME:-Administrator}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-ChangeMe123!}"
      EXPORT_DIR: "/app/exports"
    ports:
      - "3000:3000"
    volumes:
      - /data/tasktracker/exports:/app/exports
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-tasktracker}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-tasktracker}"
      POSTGRES_DB: "${POSTGRES_DB:-tasktracker}"
    volumes:
      - /data/tasktracker/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
